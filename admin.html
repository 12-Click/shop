<script>
/* Asset finder: if "assets/..." can't be found from this page's folder (e.g. Live Server opened from another folder),
   retry from common alternative locations (silently). */
(function(){
var PREFIXES=["","public/","../public/","/public/","/","../","scripts/","../scripts/","/scripts/","scripts/assets/../","../../"],bad={},tries=new WeakMap();
function next(el,attr){
  var orig=el.getAttribute("data-orig-"+attr)||el.getAttribute(attr);
  if(!/^assets\//.test(orig))return false;
  el.setAttribute("data-orig-"+attr,orig);
  var i=(tries.get(el)||0)+1;tries.set(el,i);
  if(i>=PREFIXES.length)return false;
  var url=PREFIXES[i]+orig;
  if(el.tagName==="SCRIPT"){var s=document.createElement("script");s.src=url;s.setAttribute("data-orig-src",orig);tries.set(s,i);el.parentNode.insertBefore(s,el.nextSibling);return true}
  el.setAttribute(attr,url);return true}
window.addEventListener("error",function(e){
  var el=e.target;if(!el||!el.tagName)return;
  var attr=el.tagName==="LINK"?"href":"src";
  if(!["IMG","SCRIPT","LINK"].includes(el.tagName))return;
  next(el,attr);
},true);
})();
</script>

document.getElementById("logout").onclick=async e=>{e.preventDefault();await fetch("/api/auth/logout",{method:"POST",headers:{"X-Lang":lang}});showLogin()};
document.getElementById("menu").onclick=()=>document.getElementById("sidebar").classList.toggle("show");
document.querySelectorAll("[data-view]").forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelectorAll("[data-view]").forEach(x=>x.classList.remove("active"));a.classList.add("active");renderView(a.dataset.view);document.getElementById("sidebar").classList.remove("show")});
async function loadLeads(){const d=await api("/api/leads");leads=d.leads;renderView(currentView)}
const partial=x=>(x.wonCount>0&&x.stage!=="won"&&x.productCount>1)?`<span class="chip-partial">${fill(t("partial_won"),x.wonCount,x.productCount)}</span>`:"";
function stageBadge(s){return `<span class="badge-stage stage-${s}">${esc(tm("stages",s))}</span>`}
const itemsLabel=n=>`${n} ${n==1?t("item"):t("items")}`;
function renderView(view){currentView=view;document.getElementById("viewTitle").textContent=t("title_"+view);if(view==="dashboard")dashboard();if(view==="pipeline")pipeline();if(view==="tasks")tasks()}
function stat(label,val,icon,sub){return `<div class="col-sm-6 col-xl-3"><div class="card stat"><div class="d-flex justify-content-between"><div><div class="text-secondary small">${label}</div><div class="fs-3 fw-bold mt-1">${val}</div>${sub?`<div class="small text-success fw-semibold">${sub}</div>`:""}</div><div class="stat-icon"><i class="bi ${icon}"></i></div></div></div></div>`}
let dashFilter="all",dashQ="",taskQ="";
const leadMatch=(x,q)=>{q=String(q||"").trim().toLowerCase();if(!q)return true;const svc=(x.productIds||[]).map(id=>(productNames[id]&&productNames[id][lang])||id).join(" ");return [x.name,x.email,x.company,x.message,x.owner,svc,tm("stages",x.stage)].join(" ").toLowerCase().includes(q)};
const searchBox=(id,val,fn)=>`<div class="input-group input-group-sm mb-3" style="max-width:360px"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input id="${id}" type="search" class="form-control" value="${esc(val)}" placeholder="${esc(t("search_ph"))}" aria-label="${esc(t("search_ph"))}" oninput="${fn}(this.value)"></div>`;
const isClosed=x=>["won","lost"].includes(x.stage);
function agoText(iso){if(!iso)return"";const d=Math.floor((Date.now()-new Date(iso).getTime())/864e5);return d<=0?t("today"):d===1?t("yesterday"):fill(t("days_ago"),d)}
function svcChips(x){const ids=x.productIds||[];if(!ids.length)return x.productCount?`<span class="svc-chip">${itemsLabel(x.productCount)}</span>`:"";return ids.map(id=>`<span class="svc-chip">${esc((productNames[id]&&productNames[id][lang])||id)}</span>`).join("")}
function reqCard(x){return `<div class="col-lg-6"><div class="req-card h-100" onclick="openLead('${x.id}')"><div class="d-flex justify-content-between gap-2"><div><div class="fw-bold">${esc(x.name)}${langChip(x.lang)}</div><div class="small text-secondary">${esc(x.company?x.company+" · ":"")}${esc(x.email)}</div></div><div class="text-end small"><div class="fw-semibold">${esc(agoText(x.createdAt))}</div><div class="text-secondary">${esc(String(x.createdAt||"").slice(0,10))}</div></div></div><div class="mt-2">${svcChips(x)}</div><div class="msg-clip mt-1" style="max-width:none">${x.message?esc(x.message):`<span class="text-secondary">${t("no_msg")}</span>`}</div><div class="d-flex justify-content-between align-items-center mt-3"><span class="fw-semibold">${money(x.estimatedValue)} <span class="small text-secondary fw-normal">${t("th_quote").toLowerCase()}</span></span><span class="btn btn-sm btn-primary">${t("open_btn")} <i class="bi bi-arrow-right"></i></span></div></div></div>`}
function reqTable(rows){if(!rows.length)return `<div class="text-center text-secondary py-5">${t("none_here")}</div>`;return `<div class="table-responsive"><table class="table req-table align-middle mb-0"><thead><tr><th>${t("th_req")}</th><th>${t("th_services")}</th><th>${t("th_msg")}</th><th>${t("th_stage")}</th><th>${t("th_received")}</th><th>${t("th_next")}</th></tr></thead><tbody>${rows.map(x=>`<tr class="lead-row" onclick="openLead('${x.id}')"><td><div class="fw-semibold">${esc(x.name)}${langChip(x.lang)}</div><div class="small text-secondary">${esc(x.company||"")}</div><div class="small text-secondary">${esc(x.email)}</div></td><td>${svcChips(x)}<div class="small fw-semibold mt-1">${money(x.estimatedValue)}</div>${partial(x)}</td><td><div class="msg-clip" title="${esc(x.message)}">${x.message?esc(x.message):`<span class="text-secondary">${t("no_msg")}</span>`}</div></td><td>${stageBadge(x.stage)}${x.owner?`<div class="small text-secondary mt-1"><i class="bi bi-person"></i> ${esc(x.owner)}</div>`:""}</td><td class="small"><div class="fw-semibold">${esc(agoText(x.createdAt))}</div><div class="text-secondary">${esc(String(x.createdAt||"").slice(0,10))}</div></td><td class="small">${x.nextFollowUp?`<i class="bi bi-calendar-event"></i> ${esc(x.nextFollowUp)}`:`<span class="text-secondary">${t("not_scheduled")}</span>`}</td></tr>`).join("")}</tbody></table></div>`}
function setDashFilter(f){dashFilter=f;dashboard()}
function dashboard(){const total=leads.length,open=leads.filter(x=>!isClosed(x)).length,won=leads.filter(x=>x.stage==="won").length,value=leads.reduce((a,x)=>a+Number(x.estimatedValue||0),0),wonV=leads.reduce((a,x)=>a+Number(x.wonValue||0),0);
const byNew=(a,b)=>String(b.createdAt).localeCompare(String(a.createdAt));const fresh=leads.filter(x=>x.stage==="new").sort(byNew);
const rows=leads.filter(x=>dashFilter==="all"||(dashFilter==="new"&&x.stage==="new")||(dashFilter==="progress"&&x.stage!=="new"&&!isClosed(x))||(dashFilter==="closed"&&isClosed(x))).sort(byNew);
const pill=(k,l,n)=>`<button class="btn btn-sm btn-outline-secondary ${dashFilter===k?"active":""}" onclick="setDashFilter('${k}')">${l} <span class="opacity-75">${n}</span></button>`;
document.getElementById("view").innerHTML=`<div class="row g-3 mb-4">${stat(t("new_unattended"),fresh.length,"bi-bell")}${stat(t("open_opps"),open,"bi-funnel")}${stat(t("won"),won,"bi-trophy")}${stat(t("quote_value"),money(value),"bi-currency-dollar",wonV?money(wonV)+" "+t("won_lc"):"")}</div>
<div class="card p-3 p-lg-4 mb-4"><div class="mb-3"><h5 class="fw-bold mb-1"><i class="bi bi-inbox me-2 text-primary"></i>${t("attention_title")}</h5><div class="small text-secondary">${t("attention_sub")}</div></div>${fresh.length?`<div class="row g-3">${fresh.map(reqCard).join("")}</div>`:`<div class="text-secondary py-3"><i class="bi bi-check-circle text-success me-1"></i>${t("all_clear")}</div>`}</div>
<div class="card p-3 p-lg-4"><div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div><h5 class="fw-bold mb-1">${t("all_requests")}</h5><div class="small text-secondary">${t("all_sub")}</div></div><div class="filter-pills d-flex gap-2 flex-wrap">${pill("all",t("f_all"),total)}${pill("new",t("f_new"),fresh.length)}${pill("progress",t("f_progress"),leads.filter(x=>x.stage!=="new"&&!isClosed(x)).length)}${pill("closed",t("f_closed"),leads.filter(isClosed).length)}</div></div>${searchBox("dashSearch",dashQ,"setDashQ")}<div id="reqWrap">${reqTable(rows.filter(x=>leadMatch(x,dashQ)))}</div></div>`}
function dashRows(){const isC=x=>["won","lost"].includes(x.stage);return leads.filter(x=>dashFilter==="all"||(dashFilter==="new"&&x.stage==="new")||(dashFilter==="progress"&&x.stage!=="new"&&!isC(x))||(dashFilter==="closed"&&isC(x))).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))}
function setDashQ(v){dashQ=v;document.getElementById("reqWrap").innerHTML=reqTable(dashRows().filter(x=>leadMatch(x,dashQ)))}
function tableHtml(rows){if(!rows.length)return `<div class="text-center text-secondary py-5">${t("no_leads")}</div>`;return `<div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>${t("th_lead")}</th><th>${t("th_stage")}</th><th>${t("th_quote")}</th><th>${t("th_follow")}</th><th>${t("th_updated")}</th></tr></thead><tbody>${rows.map(x=>`<tr class="lead-row" onclick="openLead('${x.id}')"><td><div class="fw-semibold">${esc(x.name)}${langChip(x.lang)}</div><div class="small text-secondary">${esc(x.email)}${x.company?" · "+esc(x.company):""}</div></td><td>${stageBadge(x.stage)}</td><td>${money(x.estimatedValue)} <span class="small text-secondary">· ${itemsLabel(x.productCount)}</span><div>${partial(x)}</div></td><td>${esc(x.nextFollowUp)||`<span class="text-secondary">${t("not_scheduled")}</span>`}</td><td class="small text-secondary">${esc((x.updatedAt||"").replace("T"," ").replace("Z"," UTC"))}</td></tr>`).join("")}</tbody></table></div>`}
function pipeline(){document.getElementById("view").innerHTML=`<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2"><div class="text-secondary">${t("pipe_help")}</div><div class="d-flex gap-2"><input id="filter" class="form-control" placeholder="${esc(t("search_ph"))}" oninput="filterPipeline()"></div></div><div id="pipelineGrid" class="row g-3">${["new","qualified","proposal","negotiation","contacted","won","lost"].map(s=>`<div class="col-xl"><div class="card p-3 h-100"><div class="d-flex justify-content-between align-items-center mb-3"><div class="fw-bold">${esc(tm("stages",s))}</div><span class="badge text-bg-light">${leads.filter(x=>x.stage===s).length}</span></div><div class="kanban vstack gap-2" data-stage="${s}">${leads.filter(x=>x.stage===s).map(cardHtml).join("")}</div></div></div>`).join("")}</div>`}
function cardHtml(x){return `<div class="border rounded-3 p-3 bg-white" onclick="openLead('${x.id}')" style="cursor:pointer"><div class="fw-semibold">${esc(x.name)}${langChip(x.lang)}</div><div class="small text-secondary">${esc(x.company||x.email)}</div><div class="d-flex justify-content-between mt-3"><span class="small fw-semibold">${money(x.estimatedValue)}</span><span class="small text-secondary">${itemsLabel(x.productCount)}</span></div>${partial(x)}</div>`}
function filterPipeline(){const q=document.getElementById("filter").value.toLowerCase();document.querySelectorAll(".kanban").forEach(k=>{const s=k.dataset.stage;k.innerHTML=leads.filter(x=>x.stage===s&&[x.name,x.email,x.company].join(" ").toLowerCase().includes(q)).map(cardHtml).join("")})}
function taskDue(){return leads.filter(x=>x.nextFollowUp&&!["won","lost"].includes(x.stage)).sort((a,b)=>String(a.nextFollowUp).localeCompare(String(b.nextFollowUp)))}
function taskBody(){const all=taskDue(),due=all.filter(x=>leadMatch(x,taskQ));return due.length?tableHtml(due):`<div class="py-5 text-center text-secondary">${all.length?t("none_here"):t("no_followups")}</div>`}
function setTaskQ(v){taskQ=v;document.getElementById("taskWrap").innerHTML=taskBody()}
function tasks(){const due=taskDue();document.getElementById("view").innerHTML=`<div class="card p-3 p-lg-4"><h5 class="fw-bold">${t("queue_title")}</h5><p class="text-secondary small">${t("queue_sub")}</p>${due.length?searchBox("taskSearch",taskQ,"setTaskQ"):""}<div id="taskWrap">${taskBody()}</div></div>`}
async function openLead(id){const d=await api("/api/leads/"+id);current=d;modal=bootstrap.Modal.getOrCreateInstance(document.getElementById("leadModal"));renderLeadModal();modal.show()}
function opts(group,values,sel){return values.map(k=>`<option value="${k}" ${sel===k?"selected":""}>${esc(tm(group,k))}</option>`).join("")}
function servicesCard(){const items=current.products,closed=items.filter(p=>["won","lost"].includes(svcStatus(p))).length,wonV=items.filter(p=>svcStatus(p)==="won").reduce((a,p)=>a+Number(p.budget||0),0);
return `<div class="card border p-3 mt-3"><div class="d-flex justify-content-between align-items-start flex-wrap gap-1"><h6 class="fw-bold mb-0">${t("quote_items")}</h6>${items.length?`<span class="small text-secondary">${fill(t("closed_of"),closed,items.length)}${wonV?" · "+money(wonV)+" "+t("won_lc"):""}</span>`:""}</div><div class="small text-secondary mt-1 mb-3">${t("services_hint")}</div><div id="products">${items.map((p,i)=>{const st=svcStatus(p);return `<div class="product-line st-${st} mb-2"><div class="d-flex justify-content-between align-items-start gap-2 mb-2"><div class="fw-semibold">${esc(pname(p))}</div><select class="form-select form-select-sm prod-status svc-select" data-i="${i}" aria-label="${esc(t("th_stage"))}">${opts("pstatus",SVC_STATUSES,st)}</select></div><div class="row g-2"><div class="col-sm-4"><div class="input-group input-group-sm"><span class="input-group-text">$</span><input class="form-control prod-budget" data-i="${i}" type="number" min="50" value="${p.budget}" aria-label="${esc(t("budget"))}"></div></div><div class="col-sm-8"><input class="form-control form-control-sm prod-notes" data-i="${i}" value="${esc(p.notes)}" placeholder="${esc(t("line_notes"))}"></div></div></div>`}).join("")||`<div class="text-secondary small">${t("no_items")}</div>`}${items.length?`<button class="btn btn-sm btn-outline-dark mt-1" onclick="saveProducts()">${t("save_items")}</button>`:""}</div></div>`}
function renderLeadModal(){const l=current.lead;document.getElementById("leadTitle").textContent=l.name;document.getElementById("leadSub").textContent=`${l.email}${l.company?" · "+l.company:""} · ${t("created")} ${fmtDate(l.createdAt)}`;
document.getElementById("leadBody").innerHTML=`
<div class="row g-4"><div class="col-lg-7"><div class="card border p-3"><div class="d-flex justify-content-between align-items-center"><h6 class="fw-bold mb-0">${t("opportunity")}</h6>${stageBadge(l.stage)}</div><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label small fw-semibold">${t("stage")}</label><select id="editStage" class="form-select">${opts("stages",["new","qualified","proposal","negotiation","contacted","won","lost"],l.stage)}</select></div><div class="col-md-6"><label class="form-label small fw-semibold">${t("priority")}</label><select id="editPriority" class="form-select">${opts("priorities",["low","normal","high","urgent"],l.priority)}</select></div><div class="col-md-6"><label class="form-label small fw-semibold">${t("owner")}</label><input id="editOwner" class="form-control" value="${esc(l.owner)}"></div><div class="col-md-6"><label class="form-label small fw-semibold">${t("next_follow")}</label><input id="editFollow" type="date" class="form-control" value="${esc(l.nextFollowUp)}"></div></div><button class="btn btn-primary mt-3" onclick="saveLead()">${t("save_opp")}</button></div>
${servicesCard()}
<div class="card border p-3 mt-3"><h6 class="fw-bold">${t("lead_context")}</h6><div class="small text-secondary mb-2">${t("client_lang")}: ${esc(l.lang==="en"?t("lang_en"):t("lang_es"))}${l.timeline?" · "+esc(l.timeline):""}</div><div style="white-space:pre-wrap">${esc(l.message)||t("no_message")}</div></div></div>
<div class="col-lg-5"><div class="card border p-3"><h6 class="fw-bold">${t("add_note")}</h6><select id="actType" class="form-select mb-2">${opts("acts",["note","follow_up","call","meeting","email","proposal"],"note")}</select><textarea id="actDetails" class="form-control" rows="4" placeholder="${esc(t("act_ph"))}"></textarea><button class="btn btn-dark mt-2 w-100" onclick="addActivity()">${t("add_timeline")}</button></div><div class="card border p-3 mt-3"><h6 class="fw-bold mb-3">${t("timeline")}</h6><div>${current.activities.map(a=>`<div class="activity ${a.detailsKey?"sys":"human"}"><div class="d-flex justify-content-between"><span class="badge text-bg-light">${esc(tm("acts",a.type))}</span><span class="small text-secondary">${esc(fmtDate(a.createdAt))}</span></div><div class="mt-2 act-text">${esc(sysText(a))}</div><div class="small text-secondary mt-1">${t("by")} ${esc(a.actor)}</div></div>`).join("")||`<div class="text-secondary small">${t("no_activity")}</div>`}</div></div></div></div>`;document.querySelectorAll(".svc-select").forEach(x=>x.addEventListener("change",saveProducts))}
const J={"Content-Type":"application/json"};
async function saveLead(){const body={stage:document.getElementById("editStage").value,priority:document.getElementById("editPriority").value,owner:document.getElementById("editOwner").value,nextFollowUp:document.getElementById("editFollow").value};await api("/api/leads/"+current.lead.id,{method:"PUT",headers:J,body:JSON.stringify(body)});await refreshModal()}
async function saveProducts(){const items=current.products.map((p,i)=>({...p,budget:document.querySelector(`.prod-budget[data-i="${i}"]`).value,status:document.querySelector(`.prod-status[data-i="${i}"]`).value,notes:document.querySelector(`.prod-notes[data-i="${i}"]`).value}));await api("/api/leads/"+current.lead.id+"/products",{method:"PUT",headers:J,body:JSON.stringify({items})});await refreshModal()}
async function addActivity(){const details=document.getElementById("actDetails").value.trim();if(!details)return;await api("/api/leads/"+current.lead.id+"/activities",{method:"POST",headers:J,body:JSON.stringify({type:document.getElementById("actType").value,details})});await refreshModal()}
async function refreshModal(){const d=await api("/api/leads/"+current.lead.id);current=d;renderLeadModal();await loadLeads();if(!document.getElementById("leadModal").classList.contains("show"))modal.show()}
function openNote(preselect){
const sel=document.getElementById("noteLead");
sel.innerHTML=leads.map(l=>`<option value="${esc(l.id)}">${esc(l.name)}${l.company?" · "+esc(l.company):""}</option>`).join("")||`<option value="">${esc(t("no_leads"))}</option>`;
if(preselect)sel.value=preselect;
document.getElementById("noteType").innerHTML=opts("acts",["note","call","meeting","email","follow_up","proposal"],"note");
const d=document.getElementById("noteDetails");d.value="";d.placeholder=t("note_ph");
document.getElementById("noteAlert").innerHTML="";document.getElementById("noteSave").disabled=!leads.length;
const m=bootstrap.Modal.getOrCreateInstance(document.getElementById("noteModal"));m.show();
document.getElementById("noteModal").addEventListener("shown.bs.modal",()=>d.focus(),{once:true})}
document.getElementById("newLead").onclick=()=>openNote();
document.getElementById("noteForm").addEventListener("submit",async e=>{e.preventDefault();
const id=document.getElementById("noteLead").value,details=document.getElementById("noteDetails").value.trim(),alertBox=document.getElementById("noteAlert"),btn=document.getElementById("noteSave");
if(!id)return;if(!details){alertBox.innerHTML=`<div class="alert alert-warning py-2 mb-0">${t("note_need_details")}</div>`;return}
btn.disabled=true;btn.textContent=t("note_saving");
try{await api("/api/leads/"+id+"/activities",{method:"POST",headers:J,body:JSON.stringify({type:document.getElementById("noteType").value,details})});
const nm=document.getElementById("noteModal");nm.addEventListener("hidden.bs.modal",async()=>{await loadLeads();openLead(id)},{once:true});bootstrap.Modal.getInstance(nm).hide()}
catch(err){alertBox.innerHTML='<div class="alert alert-danger py-2 mb-0">'+esc(err.message)+"</div>"}
finally{btn.disabled=false;btn.textContent=t("note_save")}});
boot();
</script></body></html>
